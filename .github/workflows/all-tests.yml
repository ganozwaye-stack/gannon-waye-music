# .github/workflows/all-tests.yml
name: All Tests & Compliance Audits

on:
  push:
    branches: [ main, master, upgrade/outstanding-completion-tasks ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Build
        run: npm run build

      # Run from the repo root: /playwright.config.js is the only live config
      # (the one inside src/gannonwaye-playwright-pack throws on purpose).
      # Only the Chromium projects run here; WebKit is not installed on CI.
      - name: Run Playwright Test Suite
        run: npx playwright test --project=chromium --project=mobile-chrome --project=tablet-chrome --reporter=github,html
        env:
          BASE_URL: http://localhost:5173

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  secret-scan:
    name: Secret Scanning & Credentials Check
    runs-on: ubuntu-latest
    steps:
      # Full history is needed: a shallow checkout has no base ref to diff
      # against, which made this job fail on every pull request.
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog-actions@main
        with:
          path: ./
          extra_args: --only-verified

  codeql-scan:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.3
        with:
          category: "/language:javascript-typescript"
