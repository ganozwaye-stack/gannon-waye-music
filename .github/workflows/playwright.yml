name: Playwright

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  public-routes-and-store:
    name: Public routes and store smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright pack dependencies
        run: npm ci
        working-directory: src/gannonwaye-playwright-pack

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: src/gannonwaye-playwright-pack

      - name: Build app
        run: npm run build

      - name: Run Playwright smoke suite
        run: npx playwright test tests/public-routes.spec.js tests/store-load.spec.js tests/cart.spec.js --reporter=github,html
        working-directory: src/gannonwaye-playwright-pack
        env:
          BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: src/gannonwaye-playwright-pack/playwright-report/
          retention-days: 14
