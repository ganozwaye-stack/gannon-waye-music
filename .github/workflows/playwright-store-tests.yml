# .github/workflows/playwright-store-tests.yml
# Focused live site checks for gannonwaye.com.
# Runs from the repository root so every job uses the single pinned Playwright install
# and the single root Playwright configuration.

name: Playwright Store Tests

on:
  push:
    branches: [main, master, fix/store-runtime-error]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-store:
    name: Store & Cart Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser and system dependencies
        run: npm run test:e2e:setup

      - name: Run critical store tests
        run: npm run test:e2e -- src/gannonwaye-playwright-pack/tests/store-load.spec.js src/gannonwaye-playwright-pack/tests/cart.spec.js --project=chromium --reporter=github,html
        env:
          LIVE: '1'
          BASE_URL: https://gannonwaye.com

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  test-security:
    name: Security & Coaching Lock Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser and system dependencies
        run: npm run test:e2e:setup

      - name: Run security tests
        run: npm run test:e2e -- src/gannonwaye-playwright-pack/tests/security.spec.js src/gannonwaye-playwright-pack/tests/coaching-private-lock.spec.js --project=chromium --reporter=github,html
        env:
          LIVE: '1'
          BASE_URL: https://gannonwaye.com

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: playwright-report/
          retention-days: 14
