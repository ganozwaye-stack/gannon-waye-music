# .github/workflows/playwright-store-tests.yml
# Copy this file to: .github/workflows/playwright-store-tests.yml
# in the gannonwaye-business-os GitHub repository.
#
name: Playwright Store Tests

on:
  push:
    branches: [main, master, fix/store-runtime-error]
  pull_request:
    branches: [main, master]
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

jobs:
  test-store:
    name: Store & Cart Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright test-pack dependencies
        run: npm ci
        working-directory: src/gannonwaye-playwright-pack

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: src/gannonwaye-playwright-pack

      - name: Build app
        run: npm run build

      - name: Run critical store tests
        run: npx playwright test tests/store-load.spec.js tests/cart.spec.js --reporter=github,html
        working-directory: src/gannonwaye-playwright-pack
        env:
          BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: src/gannonwaye-playwright-pack/playwright-report/
          retention-days: 14

  test-security:
    name: Security & Coaching Lock Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright test-pack dependencies
        run: npm ci
        working-directory: src/gannonwaye-playwright-pack

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: src/gannonwaye-playwright-pack

      - name: Build app
        run: npm run build

      - name: Run security tests
        run: npx playwright test tests/security.spec.js tests/coaching-private-lock.spec.js --reporter=github
        working-directory: src/gannonwaye-playwright-pack
        env:
          BASE_URL: http://localhost:5173

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: src/gannonwaye-playwright-pack/playwright-report/
          retention-days: 14
