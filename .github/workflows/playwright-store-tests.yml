# .github/workflows/playwright-store-tests.yml
# Copy this file to: .github/workflows/playwright-store-tests.yml
# in the gannonwaye-business-os GitHub repository.
#
# If tests are inside a subfolder (e.g. gannonwaye-playwright-pack),
# uncomment the working-directory lines below.

name: Playwright Store Tests

on:
  push:
    branches: [main, master, fix/store-runtime-error]
  pull_request:
    branches: [main, master]
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

jobs:
  test-store:
    name: Store & Cart Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Uncomment if tests are in a subfolder:
    # defaults:
    #   run:
    #     working-directory: gannonwaye-playwright-pack

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run critical store tests
        run: npx playwright test tests/store-load.spec.js tests/cart.spec.js --reporter=github,html
        env:
          BASE_URL: https://gannonwaye.com

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  test-security:
    name: Security & Coaching Lock Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # defaults:
    #   run:
    #     working-directory: gannonwaye-playwright-pack

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run security tests
        run: npx playwright test tests/security.spec.js tests/coaching-private-lock.spec.js --reporter=github
        env:
          BASE_URL: https://gannonwaye.com

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: playwright-report/
          retention-days: 14