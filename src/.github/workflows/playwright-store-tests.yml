# .github/workflows/playwright-store-tests.yml
# Automated Playwright store tests for gannonwaye.com
# Runs on push to main, PRs, manually, and every 6 hours while store repair is active.

name: Playwright Store Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours (UTC)

jobs:
  test-store:
    name: Store & Cart Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: gannonwaye-playwright-pack

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gannonwaye-playwright-pack/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run critical store tests
        run: npx playwright test tests/store-load.spec.js tests/cart.spec.js --reporter=github,html
        env:
          BASE_URL: https://gannonwaye.com

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-store-report
          path: gannonwaye-playwright-pack/playwright-report/
          retention-days: 14

  test-checkout:
    name: Checkout & Promo Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-store

    defaults:
      run:
        working-directory: gannonwaye-playwright-pack

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gannonwaye-playwright-pack/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run checkout and promo tests
        run: npx playwright test tests/checkout.spec.js tests/promo-codes.spec.js --reporter=github,html
        env:
          BASE_URL: https://gannonwaye.com

      - name: Upload checkout report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-checkout-report
          path: gannonwaye-playwright-pack/playwright-report/
          retention-days: 14

  test-security:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: gannonwaye-playwright-pack

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gannonwaye-playwright-pack/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run security tests
        run: npx playwright test tests/security.spec.js --reporter=github
        env:
          BASE_URL: https://gannonwaye.com

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-security-report
          path: gannonwaye-playwright-pack/playwright-report/
          retention-days: 14