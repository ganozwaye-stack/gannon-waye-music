services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      # Public Base44 app binding (same ID as base44/.app.jsonc) — not a secret.
      - VITE_BASE44_APP_ID=69eb7905ca6eb4180010f794
      - VITE_BASE44_APP_BASE_URL=https://gannonwaye.base44.app
      - CHOKIDAR_USEPOLLING=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - /run/base44/app.env
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173"

volumes:
  node_modules:
