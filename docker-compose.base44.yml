services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - VITE_BASE44_APP_ID=6a1d91c28109c1a7274f350a
      - VITE_FORCE_LOCAL_MODE=true
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    restart: unless-stopped

volumes:
  node_modules:
