    <!-- Silence Base44 app-log/log-user-in-app 429s at ALL transport layers (fetch + XHR + axios).
         Runs before any script/module load. Never blocks rendering, never affects Stripe/TikTok/PostHog/auth. -->
    <script>
      (function() {
        var LOG_URL_FRAGMENT = 'log-user-in-app';
        var APP_LOG_PATH = '/app-logs/';
        var THROTTLE_MS = 30000;
        var _lastCall = {};
        var _isAuditRun = /[?&]audit=/.test(location.search);
        var _isBot = /HeadlessChrome|Playwright|puppeteer|PhantomJS|selenium|bot|crawl/i.test(navigator.userAgent);

        function _isLogUrl(url) {
          return url && url.indexOf(APP_LOG_PATH) !== -1 && url.indexOf(LOG_URL_FRAGMENT) !== -1;
        }

        function _shouldSuppress(url) {
          if (_isAuditRun || _isBot) return true;
          var key = url.split('?')[0];
          var now = Date.now();
          if (_lastCall[key] && (now - _lastCall[key]) < THROTTLE_MS) return true;
          _lastCall[key] = now;
          return false;
        }

        var _stubResponse = function() {
          return new Response('{}', { status: 200, headers: { 'Content-Type': 'application/json' } });
        };

        // --- Patch 1: window.fetch ---
        var _nativeFetch = window.fetch;
        window.fetch = function(input, init) {
          var url = (typeof input === 'string') ? input : (input && input.url) || '';
          if (_isLogUrl(url)) {
            if (_shouldSuppress(url)) return Promise.resolve(_stubResponse());
            return _nativeFetch.apply(this, arguments).then(function(res) {
              return (res.status === 429) ? _stubResponse() : res;
            }).catch(function() { return _stubResponse(); });
          }
          return _nativeFetch.apply(this, arguments);
        };

        // --- Patch 2: XMLHttpRequest (axios uses XHR in browsers) ---
        var _NativeXHR = window.XMLHttpRequest;
        function PatchedXHR() {
          var xhr = new _NativeXHR();
          var _open = xhr.open.bind(xhr);
          var _send = xhr.send.bind(xhr);
          var _isLogRequest = false;
          var _url = '';

          xhr.open = function(method, url) {
            _url = url || '';
            _isLogRequest = _isLogUrl(_url);
            return _open.apply(xhr, arguments);
          };

          xhr.send = function() {
            if (_isLogRequest) {
              if (_shouldSuppress(_url)) {
                // No-op: fake a completed 200 immediately
                setTimeout(function() {
                  try {
                    Object.defineProperty(xhr, 'status', { get: function() { return 200; } });
                    Object.defineProperty(xhr, 'responseText', { get: function() { return '{}'; } });
                    Object.defineProperty(xhr, 'response', { get: function() { return '{}'; } });
                    Object.defineProperty(xhr, 'readyState', { get: function() { return 4; } });
                  } catch(e) {}
                  if (typeof xhr.onreadystatechange === 'function') { try { xhr.onreadystatechange(); } catch(e) {} }
                  if (typeof xhr.onload === 'function') { try { xhr.onload(); } catch(e) {} }
                }, 0);
                return;
              }
              // Let it through but intercept 429 response
              xhr.addEventListener('readystatechange', function() {
                if (xhr.readyState === 4 && xhr.status === 429) {
                  try {
                    Object.defineProperty(xhr, 'status', { get: function() { return 200; }, configurable: true });
                    Object.defineProperty(xhr, 'responseText', { get: function() { return '{}'; }, configurable: true });
                  } catch(e) {}
                }
              });
            }
            return _send.apply(xhr, arguments);
          };

          return xhr;
        }
        // Copy static properties from native XHR
        PatchedXHR.prototype = _NativeXHR.prototype;
        for (var k in _NativeXHR) {
          if (_NativeXHR.hasOwnProperty(k)) PatchedXHR[k] = _NativeXHR[k];
        }
        PatchedXHR.UNSENT = 0; PatchedXHR.OPENED = 1; PatchedXHR.HEADERS_RECEIVED = 2;
        PatchedXHR.LOADING = 3; PatchedXHR.DONE = 4;
        window.XMLHttpRequest = PatchedXHR;

        // --- Patch 3: suppress console.error for 429 app-log responses ---
        var _nativeConsoleError = console.error;
        console.error = function() {
          var msg = Array.prototype.join.call(arguments, ' ');
          if (msg.indexOf('429') !== -1 && (msg.indexOf('app-log') !== -1 || msg.indexOf('log-user-in-app') !== -1)) {
            return; // silently swallow
          }
          return _nativeConsoleError.apply(console, arguments);
        };

      })();
    </script>
