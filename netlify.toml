[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/mum*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/without-you-here*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/mums-garden*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[redirects]]
  from = "/audio/mum/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/images/mum/garden-textures/melbourne-fern-gully-2017.jpg"
  to = "/404"
  status = 404
  force = true

